services:
  phpfpm:
    build:
      context: ./phpfpm
      dockerfile: Dockerfile
    container_name: php_fpm
    volumes:
      - ../src/:/var/www/html/
    depends_on:
      - database
    networks:
      - app_network

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_server
    ports:
      - "8080:80"
    volumes:
      - ../src/:/var/www/html/
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - phpfpm
    networks:
      - app_network

  database:
    image: mysql:8.4
    container_name: mysql_server
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_USER: "admin"
      MYSQL_PASSWORD: "admin"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      start_period: 15s
      interval: 6s
      timeout: 5s
      retries: 20
    ports:
      - 3306:3306
    volumes:
      - ./mysql/dump/:/docker-entrypoint-initdb.d/
      - mysql_data_persistence:/var/lib/mysql
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data_persistence:
